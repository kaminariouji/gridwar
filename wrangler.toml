name = "gridwar"
main = "worker.js"
compatibility_date = "2026-10-01"

[durable_objects]
bindings = [
  { name = "MATCH", class_name = "MatchDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
